name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        run: |
          mkdir -p assets

          curl -o assets/github-stats.svg \
            "https://github-readme-stats.vercel.app/api?username=SSSSizn&show_icons=true&hide_border=true&count_private=true&include_all_commits=true"

          curl -o assets/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=SSSSizn&layout=compact&hide_border=true&hide=html,css"

      - name: Commit files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add assets/*.svg

          git commit -m "update stats" || echo "No changes"

          git push
